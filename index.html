<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="com.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Social Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom font - Inter */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0; /* Basic reset */
            transition: background 0.7s ease-in-out; /* Smooth transition for background changes */
        }
        /* Fallback for Inter font if Google Fonts is not available */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        /* Styling for the social media icons for a little pop */
        .social-icon {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            font-size: 0.9rem; /* Reduced font size for social icon text */
        }
        .social-icon:hover {
            transform: translateY(-5px) scale(1.03); /* Adjusted scale for consistency */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .container {
            width: 100%;
            max-width: 500px; /* Max width for the content card */
            padding: 1rem; /* Padding for smaller screens */
            animation: zoomInEffect 0.9s ease-out forwards; /* Added zoom-in animation */
            /* Ensure container background is distinct if body background changes dramatically */
            background-color: rgba(30, 41, 59, 0.9); /* Tailwind slate-800 with slight transparency */
            /* The container already has bg-slate-800 via Tailwind, this ensures it's respected */
        }
        @media (min-width: 640px) { /* sm breakpoint in Tailwind */
            .container {
                padding: 2rem; /* More padding for larger screens */
            }
        }
        /* Updated transition for info-button to include box-shadow */
        .info-button {
            transition: background-color 0.3s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        /* Updated hover effect for info-button to match social-icon */
        .info-button:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        /* Keyframes for the continuous spin animation */
        @keyframes continuousSpin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Styling for profile picture spin animation */
        .profile-picture {
            transition: transform 0.5s ease-in-out; /* Smooth transition for the initial state (not spinning) */
        }
        .profile-picture:hover {
            animation: continuousSpin 2s linear infinite; /* Apply continuous spin on hover */
        }

        /* Keyframes for the zoom-in animation */
        @keyframes zoomInEffect {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        /* Styling for the countdown timer */
        #birthdayCountdown {
            font-size: 1rem;
            color: #cbd5e1; /* slate-300 */
            margin-bottom: 0.5rem; /* Reduced margin to bring age closer */
        }
        /* Styling for age display */
        #ageDisplay {
            font-size: 1rem;
            color: #cbd5e1; /* slate-300 */
            margin-bottom: 1.5rem; /* Add some space below the age */
        }
        /* Styling for bio text */
        .bio-text {
            font-size: 0.95rem; /* Reduced font size for bio */
        }
        /* Styling for highlighted text in bio */
        .highlight-text {
            color: #818cf8; /* Tailwind's indigo-400, can be adjusted */
            font-weight: 600; /* semi-bold */
        }

        /* Container for profile picture and dragon text */
        .profile-image-wrapper {
            display: inline-block; /* Keeps the block tight around its content */
            text-align: center; /* Centers the image and the text block below it */
        }

        /* Styling for the "Do Not The Dragon" text */
        #dragonText {
            max-height: 0; /* Initially collapsed */
            opacity: 0; /* Initially invisible */
            overflow: hidden; /* Crucial for the max-height transition */
            color: #f87171; /* A reddish color */
            font-weight: bold;
            font-size: 1.5rem; /* Increased font size */
            white-space: nowrap; /* Prevent text from wrapping */
            background-color: rgba(30, 41, 59, 0.85); /* Dark slate background with opacity */
            border-radius: 0.375rem; /* Tailwind's rounded-md */
            padding-left: 12px; /* Adjusted horizontal padding */
            padding-right: 12px; /* Adjusted horizontal padding */
            padding-top: 0; /* Vertical padding controlled by transition */
            padding-bottom: 0; /* Vertical padding controlled by transition */
            margin-top: 0; /* Margin controlled by transition */
            box-sizing: border-box; /* Ensures padding doesn't add to max-height unexpectedly */
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out, margin-top 0.4s ease-out, padding-top 0.4s ease-out, padding-bottom 0.4s ease-out;
        }

        #dragonText.visible {
            max-height: 70px; /* Increased max-height to accommodate larger text and padding */
            opacity: 1;
            margin-top: 10px; /* Adjusted space between image and text box */
            padding-top: 6px; /* Adjusted vertical padding when visible */
            padding-bottom: 6px; /* Adjusted vertical padding when visible */
        }

        /* Flame animation for the body background */
        @keyframes flameAnimation {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 0% 50%; }
            75% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .flames-background {
            /* Using !important to ensure it overrides Tailwind's gradient if necessary.
               A more specific selector or different CSS ordering could also work. */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab, #ff4500, #ff8c00, #ff0000) !important;
            background-size: 600% 600% !important; /* Larger size for smoother, slower animation */
            animation: flameAnimation 15s ease infinite !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-700 text-white flex flex-col items-center min-h-screen p-4">

    <div class="container bg-slate-800 shadow-2xl rounded-xl p-6 md:p-10 text-center">
        <div class="mb-6"> 
            <div class="profile-image-wrapper">
                <img src="com.png" alt="Profile Picture" id="profilePic" class="profile-picture w-32 h-32 md:w-40 md:h-40 rounded-full mx-auto border-2 border-indigo-500 shadow-lg object-cover" onerror="this.onerror=null; this.src='https://placehold.co/150x150/6366f1/e0e7ff?text=Image+Not+Found';">
                <p id="dragonText">Do Not The Dragon</p>
            </div>
        </div>

        <audio id="spinSound" src="you_spin_me_round.mp3" preload="auto"></audio>

        <div class="mb-6"> 
            <h1 class="text-3xl md:text-4xl font-bold mb-2 text-indigo-400">Kazu Hani</h1>
            <p class="text-slate-300 bio-text text-base md:text-lg mb-4"> 
                <span class="highlight-text">Welcome to my personal hub!</span>
            </p>
            <div class="mb-4"> 
                 <a href="https://vgen.co/c/kazu-hani/kazu-hani" target="_blank" rel="noopener noreferrer"
                   class="info-button inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm shadow-md">
                    More info about Kazu
                </a>
            </div>
        </div>

        <div id="birthdayCountdown" class="text-slate-300">
            Birthday is in <span id="countdownTimer">Loading...</span>
        </div>

        <div id="ageDisplay" class="text-slate-300">
            I am currently <span id="currentAge"></span> years old.
        </div>

        <div class="space-y-4">
            <a href="https://x.com/Kazu_Hani" target="_blank" rel="noopener noreferrer"
               class="social-icon flex items-center justify-center w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md">
                <img src="twitter_logo.png" alt="Twitter Logo" class="w-6 h-6 mr-3" onerror="this.onerror=null; this.src='https://placehold.co/24x24/1DA1F2/ffffff?text=T&font=roboto'; this.alt='Twitter Placeholder';">
                Twitter
            </a>
            <a href="https://www.tiktok.com/@kazu_hani" target="_blank" rel="noopener noreferrer"
               class="social-icon flex items-center justify-center w-full bg-black hover:bg-gray-800 text-white font-semibold py-3 px-4 rounded-lg shadow-md">
                <img src="tiktok_logo.png" alt="TikTok Logo" class="w-6 h-6 mr-3" onerror="this.onerror=null; this.src='https://placehold.co/24x24/000000/ffffff?text=TT&font=roboto'; this.alt='TikTok Placeholder';">
                TikTok
            </a>
            <a href="https://www.youtube.com/@Kazu_Hani" target="_blank" rel="noopener noreferrer"
               class="social-icon flex items-center justify-center w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md">
                <img src="youtube_logo.png" alt="YouTube Logo" class="w-6 h-6 mr-3" onerror="this.onerror=null; this.src='https://placehold.co/24x24/FF0000/ffffff?text=YT&font=roboto'; this.alt='YouTube Placeholder';">
                YouTube
            </a>
            <a href="https://steamcommunity.com/id/Kazu-Hani/" target="_blank" rel="noopener noreferrer"
               class="social-icon flex items-center justify-center w-full bg-slate-600 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md">
                <img src="steam_logo.png" alt="Steam Logo" class="w-6 h-6 mr-3" onerror="this.onerror=null; this.src='https://placehold.co/24x24/1b2838/ffffff?text=S&font=roboto'; this.alt='Steam Placeholder';">
                Steam
            </a>
            <a href="https://www.reddit.com/user/Korat24/" target="_blank" rel="noopener noreferrer"
               class="social-icon flex items-center justify-center w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md">
                <img src="reddit_logo.png" alt="Reddit Logo" class="w-6 h-6 mr-3" onerror="this.onerror=null; this.src='https://placehold.co/24x24/FF5700/ffffff?text=R&font=roboto'; this.alt='Reddit Placeholder';">
                Reddit
            </a>
        </div>

        <footer class="mt-10 pt-6 border-t border-slate-600">
            </footer>
    </div>

    <script>
        // Profile picture elements and sound
        const profilePic = document.getElementById('profilePic');
        const spinSound = document.getElementById('spinSound');
        const dragonText = document.getElementById('dragonText'); 
        let dragonTimeout; 

        if (spinSound) {
            spinSound.load();
        }

        profilePic.addEventListener('mouseenter', () => {
            if (spinSound && spinSound.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) {
                spinSound.currentTime = 0;
                const playPromise = spinSound.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.warn("Audio play on hover was prevented by the browser.", error);
                    });
                }
            } else if (spinSound) {
                console.warn("Audio is not ready to play. Current readyState: " + spinSound.readyState);
            }

            clearTimeout(dragonTimeout); 
            dragonTimeout = setTimeout(() => {
                dragonText.classList.add('visible');
                document.body.classList.add('flames-background'); // Add flame background to body
            }, 3000); 
        });

        profilePic.addEventListener('mouseleave', () => {
            if (spinSound) {
                spinSound.pause();
                spinSound.currentTime = 0;
            }
            clearTimeout(dragonTimeout);
            dragonText.classList.remove('visible');
            document.body.classList.remove('flames-background'); // Remove flame background from body
        });

        // Birthday Countdown Logic
        const countdownTimerElement = document.getElementById('countdownTimer');
        const birthdayMonth = 10; // November (0-indexed, so January is 0)
        const birthdayDay = 9;

        function calculateTimeDifference(endDate, startDate) {
            let diffMs = endDate.getTime() - startDate.getTime();

            if (diffMs <= 0) {
                return { months: 0, weeks: 0, days: 0, hours: 0, minutes: 0, seconds: 0, isPast: true };
            }

            let seconds = Math.floor((diffMs / 1000) % 60);
            let minutes = Math.floor((diffMs / (1000 * 60)) % 60);
            let hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);

            let months = 0;
            let tempCounterDate = new Date(startDate);

            for (let i = 0; i < 120; i++) { 
                let nextMonthTemp = new Date(tempCounterDate);
                nextMonthTemp.setMonth(nextMonthTemp.getMonth() + 1);
                if (nextMonthTemp <= endDate) {
                    months++;
                    tempCounterDate.setMonth(tempCounterDate.getMonth() + 1);
                } else {
                    break;
                }
            }
            
            let remainingMsAfterMonths = endDate.getTime() - tempCounterDate.getTime();
            if (remainingMsAfterMonths < 0) remainingMsAfterMonths = 0; 

            let totalDaysAfterMonths = Math.floor(remainingMsAfterMonths / (1000 * 60 * 60 * 24));
            
            let weeks = Math.floor(totalDaysAfterMonths / 7);
            let days = totalDaysAfterMonths % 7;

            return { months, weeks, days, hours, minutes, seconds, isPast: false };
        }

        function updateCountdown() {
            if (!countdownTimerElement) return; 

            const now = new Date();
            let currentYear = now.getFullYear();
            let targetBirthdayDate = new Date(currentYear, birthdayMonth, birthdayDay, 0, 0, 0, 0);

            if (now.getMonth() === birthdayMonth && now.getDate() === birthdayDay) {
                 countdownTimerElement.innerHTML = "Happy Birthday!";
                 return;
            }
            
            if (now.getTime() >= targetBirthdayDate.getTime()) {
                targetBirthdayDate.setFullYear(currentYear + 1);
            }
            
            const timeParts = calculateTimeDifference(targetBirthdayDate, now);

            if (timeParts.isPast) { 
                countdownTimerElement.innerHTML = "It's past!"; 
                return;
            }

            let parts = [];
            if (timeParts.months > 0) parts.push(`${timeParts.months} month${timeParts.months > 1 ? 's' : ''}`);
            if (timeParts.weeks > 0) parts.push(`${timeParts.weeks} week${timeParts.weeks > 1 ? 's' : ''}`);
            if (timeParts.days > 0) parts.push(`${timeParts.days} day${timeParts.days !== 1 ? 's' : ''}`);
            
            if (parts.length > 0 || timeParts.hours > 0 || timeParts.minutes > 0 || timeParts.seconds >= 0 ) {
                if (timeParts.hours > 0 || timeParts.minutes > 0 || timeParts.seconds >= 0 || parts.length === 0) {
                    parts.push(`${timeParts.hours}h ${timeParts.minutes}m ${timeParts.seconds}s`);
                }
            }
            
            if (parts.length > 0) {
                countdownTimerElement.innerHTML = parts.join(', ');
            } else {
                countdownTimerElement.innerHTML = "It's almost here!"; 
            }
        }

        if (countdownTimerElement) {
            setInterval(updateCountdown, 1000);
            updateCountdown(); 
        }

        // Age Calculation Logic
        const ageElement = document.getElementById('currentAge');
        const birthDate = new Date(2001, 10, 9); 

        function calculateAge() {
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDifference = today.getMonth() - birthDate.getMonth();
            if (monthDifference < 0 || (monthDifference === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            if (ageElement) {
                ageElement.textContent = age;
            }
        }
        if (ageElement) {
            calculateAge();
        }
        
    </script>
</body>
