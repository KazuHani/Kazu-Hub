<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;

  }
  .petal {
    position: fixed; top: -8%; pointer-events: none; user-select: none;
    filter: blur(2px);
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(0)     translateX(0)    rotate(0deg); }
    50%  { transform: translateY(55vh)  translateX(3vw)  rotate(180deg); }
    100% { transform: translateY(112vh) translateX(-2vw) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) { .petal { display: none; } }
  .card {
    position: relative; max-width: 420px; width: 100%; text-align: center;
    background: rgba(46,70,108,.74); backdrop-filter: blur(10px);
    border: 1px solid rgba(92,150,220,.55); border-radius: 24px;
    box-shadow: 0 14px 34px rgba(3,10,24,.16); padding: 38px 30px 32px;
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(92,150,220,.55); margin-bottom: 14px;
  }
  .code {
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 72px;
    line-height: 1; letter-spacing: .02em;
  }
  h1 {
    font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 24px;
    margin-top: 8px;
  }
  p { color: #9db8d4; font-size: 15px; line-height: 1.55; margin-top: 10px; }
  .home {
    display: inline-block; margin-top: 22px; padding: 12px 26px;
    font: 800 15px 'Nunito', sans-serif; color: #0d1b31; text-decoration: none;
    background: #5cc6ff; border-radius: 999px;
    transition: transform .15s ease, background .15s ease;
  }
  .home:hover, .home:focus-visible { background: #8fd9ff; transform: translateY(-2px); }
</style>
